<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vampir Köylü Güncelleniyor</title>
</head>
<body style="margin:0;display:grid;place-items:center;min-height:100vh;background:#260c12;color:#f4d7ca;font:700 18px system-ui">
  <p>Güncel sürüm hazırlanıyor…</p>
  <script>
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
      location.replace('/oyunlar/vampir_koylu_game/web-v2/index.html');
    })();
  </script>
</body>
</html>
